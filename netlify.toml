# Netlify static hosting for the ZeroLeak SPA (Vite build output in dist/).
# The Express server (dist/server.cjs) is not run by Netlify: /api/* calls are
# made same-origin and proxied at Netlify's edge to the laptop's backend
# through its ngrok tunnel. Proxying (instead of the browser calling the tunnel
# directly) removes browser-side CORS, ngrok's interstitial page, and flaky
# mobile-to-tunnel connections from the equation.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The backend is reached through the free ngrok tunnel from this deployment;
  # SSE streams cannot carry the ngrok skip header, so Prism uses the verified
  # polling transports in this build (same-origin desktop builds keep SSE).
  VITE_PRISM_POLLING = "1"

# Route API calls through a Netlify Function so it can forward ngrok's required
# skip header. Netlify rewrites do not reliably forward custom request headers,
# which otherwise exposes ngrok's browser-warning HTML to the SPA.
# NOTE: if the tunnel URL ever changes, update it in netlify/functions/api.ts.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?path=:splat"
  status = 200
  force = true

[functions]
  directory = "netlify/functions"

# SPA fallback so deep links and refreshes resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
