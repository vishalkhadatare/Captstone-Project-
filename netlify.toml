# Netlify static hosting for the ZeroLeak SPA (Vite build output in dist/).
# The Express server (dist/server.cjs) is not run by Netlify. The SPA calls the
# configured backend tunnel directly; the frontend supplies the ngrok bypass
# header and the backend allows the Netlify origin via CORS.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Static Netlify builds call the backend directly. The frontend adds the
  # ngrok skip header and the backend permits the Netlify origin via CORS.
  VITE_API_URL = "https://backed-repeated-aerobics.ngrok-free.dev"
  # SSE streams cannot carry the ngrok skip header, so Prism uses polling here.
  VITE_PRISM_POLLING = "1"

# SPA fallback so deep links and refreshes resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
