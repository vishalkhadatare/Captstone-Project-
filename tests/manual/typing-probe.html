<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Streamed typing probe</title>
    <style>
      body { margin: 0; background: #0f172a; color: #e2e8f0; font: 16px/1.5 system-ui, sans-serif; padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { color: #94a3b8; margin: 0 0 16px; }
      input { width: calc(100% - 8px); box-sizing: border-box; font: 700 40px/1.4 ui-monospace, monospace; padding: 12px 16px;
              border-radius: 12px; border: 2px solid #334155; background: #020617; color: #f8fafc; }
      input:focus { outline: none; border-color: #34d399; }
      #report { margin-top: 16px; font: 14px/1.6 ui-monospace, monospace; color: #a7f3d0; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!--
      Why this exists: the streamed browser is a picture, so "did my typing arrive"
      cannot be answered by looking at the panel's DOM - the field that receives the
      text lives in another process. This page focuses its own input, so a streamed
      probe can type into it with no coordinate to get right, then screenshot the
      panel and read the result back by eye. It proves the whole path (panel -> hub
      -> host -> a real Chromium), which is where a lost space bar hides.

      Open it through the dev server: http://127.0.0.1:3000/tests/manual/typing-probe.html
    -->
    <h1>Streamed typing probe</h1>
    <p>This field focuses itself - anything typed into the panel should land here, spaces included.</p>
    <input id="field" autofocus autocomplete="off" spellcheck="false" placeholder="type here" />
    <div id="report">keystrokes: 0</div>
    <script>
      const field = document.getElementById('field');
      const report = document.getElementById('report');
      let keys = 0;
      const show = () => {
        report.textContent = `keystrokes: ${keys}\nvalue: ${JSON.stringify(field.value)}\nspaces: ${(field.value.match(/ /g) || []).length}`;
      };
      document.addEventListener('keydown', () => { keys += 1; show(); });
      field.addEventListener('input', show);
      window.addEventListener('load', () => { field.focus(); show(); });
      show();
    </script>
  </body>
</html>
